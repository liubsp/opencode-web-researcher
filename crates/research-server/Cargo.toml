[package]
name = "research-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
research-core.workspace = true
research-store.workspace = true
research-browser.workspace = true
research-chatgpt = { path = "../research-chatgpt" }
axum = "0.8"
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_Console"] }

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = "0.28"
futures-util = "0.3"
