[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
research-core = { path = "crates/research-core" }
research-store = { path = "crates/research-store" }
research-browser = { path = "crates/research-browser" }
research-server = { path = "crates/research-server" }
