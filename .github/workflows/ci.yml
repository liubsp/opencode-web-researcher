name: Check and package
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p research-app
      - run: npm pack --workspace web-research-opencode
      - uses: actions/upload-artifact@v4
        with:
          name: web-research-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/release/web-research
            target/release/web-research.exe
            web-research-opencode-*.tgz
            README.md
            LICENSE
